// Játékos
autoaim 0.0
cl_run 1
name "Wolfman"
gender "male"
color "FF 00 00"

// Billentyűk
bind f11 chase
bind f12 screenshot
unbind t
unbind f5
unbind f7
unbind f10

// Grafika
cl_bloodtype 1
cl_pufftype 1
cl_rockettrails 1
fov 105
vid_defwidth 2560
vid_defheight 1080
gl_billboard_faces_camera 1
r_actorspriteshadow 2
r_quakeintensity 0.1

// Hang
snd_hrtf 1
snd_mididevice 0

// Felület
crosshairgrow 1
m_show_backbutton -1
// screenblocks 11

// Automap
am_customcolors 0
am_followplayer 0
am_showitems 1

// Egyéb
autoloadlights 0
autoloadbrightmaps 0
dehload 1
language enu
// logfile gzdoom.log
quicksaverotation 1
saveloadconfirmation 0
save_dir "./save"
screenshot_dir "./screenshots"
showendoom 2
// vid_fps 1

// BERZERKER MÓD
alias berzerker "give all; sv_fastweapons 2; sv_infiniteammo 1; turbo 255"
alias berzerkeroff "sv_fastweapons 0; sv_infiniteammo 0; turbo 100"

// Modok
bonsai_hud_mirror 3
// bonsai_hud_x 0.66666
fullhud_stats_items 5
fullhud_stats_kills 5
fullhud_stats_powerups 6
fullhud_stats_secrets 5
fullhud_stats_time 6
fullhud_stats_type 3
m8f_aas_console_log_level -1
m8f_aas_screen_level -1
m8f_hn_compass_show 0
m8f_ts_font "NewSmallFont"
m8f_ts_pip "="
sv_portrait_bonus_unlocked true
